name: Build and Push Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select published tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/markitdown-server
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "image=$IMAGE_REPOSITORY:$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "image=$IMAGE_REPOSITORY:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.github
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/markitdown-server:${{ github.sha }}
